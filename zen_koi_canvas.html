<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper Realistic Zen Koi 🐟</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body, html {
    overflow: hidden;
    background: #06151a;
  }

  #canvas-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 50%, #0d2a33 0%, #030b0e 100%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* Add subtle blur filter to background via canvas backdrop if needed, but we keep it crisp */
  }

  /* Aesthetic Background Text */
  .hero-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, 0.05); /* Super faint text */
    font-family: 'Georgia', serif;
    font-size: 6rem;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.1em;
    pointer-events: none; /* Let clicks pass thru */
    text-align: center;
    width: 100%;
    text-shadow: 0px 10px 20px rgba(0,0,0,0.5);
  }

  /* Caustic overlay effect for water ripples */
  .water-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0.3;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05) 0%, transparent 50%);
    mix-blend-mode: overlay;
  }
</style>
</head>
<body>

<div id="canvas-container">
  <div class="water-overlay"></div>
  <div class="hero-text">Breathe</div>
  <canvas id="koiCanvas"></canvas>
</div>

<script>
  const canvas = document.getElementById('koiCanvas');
  const ctx = canvas.getContext('2d');
  
  let width, height;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let mouse = { x: width / 2, y: height / 2, active: false };
  
  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('touchmove', (e) => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
  });

  // Inverse Kinematics Procedural Koi Fish 💅✨
  class RealisticKoi {
    constructor(x, y, scale, patternType) {
      this.x = x;
      this.y = y;
      this.scale = scale;
      this.patternType = patternType; // 'kohaku' (white/red) or 'showa' (black/red/white)
      
      // Physics and movement properties
      this.vx = 0;
      this.vy = 0;
      this.angle = Math.random() * Math.PI * 2;
      this.swimCycle = Math.random() * 100;
      
      // 1. SET UP THE SPINE (Inverse Kinematics)
      this.numSegments = 16;
      this.segmentLength = 12 * this.scale;
      this.spine = [];
      
      // Body thickness mapping for each segment to create organic fish shape
      this.widths = [
        14, 18, 22, 24, 25, // Head to thickest part
        24, 22, 19, 16, 13, // Mid body tapering
        10, 8, 6, 5, 4, 3   // Tail tapering
      ].map(w => w * this.scale);

      for(let i = 0; i < this.numSegments; i++) {
        this.spine.push({
          x: this.x - i * this.segmentLength,
          y: this.y,
          angle: this.angle
        });
      }

      // Generate random patterns for the body
      this.generatePattern();
    }

    generatePattern() {
      this.splotches = [];
      const numSplotches = Math.floor(Math.random() * 4) + 3;
      for(let i = 0; i < numSplotches; i++) {
        this.splotches.push({
          // Attach spot to a specific segment index
          segmentIndex: Math.floor(Math.random() * (this.numSegments - 4)) + 1,
          offsetX: (Math.random() - 0.5) * 10 * this.scale,
          size: (Math.random() * 15 + 10) * this.scale,
          color: this.patternType === 'showa' && Math.random() > 0.5 ? '#1a1a1a' : '#d84b22' // Deep red or black
        });
      }
      // Add a guaranteed head splotch (classic Koi look)
      this.splotches.push({ segmentIndex: 1, offsetX: 0, size: 18 * this.scale, color: '#d84b22' });
    }

    update() {
      this.swimCycle += 0.08;

      // Organic roaming if mouse isn't active, else follow mouse smoothly
      let targetX, targetY;
      
      if (mouse.active) {
        targetX = mouse.x;
        targetY = mouse.y;
      } else {
        // Just swim in a chill circle-ish pattern if no mouse
        targetX = width/2 + Math.cos(this.swimCycle * 0.2) * 300;
        targetY = height/2 + Math.sin(this.swimCycle * 0.3) * 200;
      }

      let dx = targetX - this.spine[0].x;
      let dy = targetY - this.spine[0].y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      
      // Steering behavior
      let targetAngle = Math.atan2(dy, dx);
      
      // Calculate angle difference avoiding snap
      let angleDiff = targetAngle - this.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      
      // Turn radius based on distance
      this.angle += angleDiff * 0.03;

      // Speed calculation (accelerate when far, slow down when close)
      // Add a slight sine wave to speed to simulate tail strokes!
      let baseSpeed = Math.min(dist * 0.015, 3 * this.scale);
      let strokePropulsion = Math.sin(this.swimCycle) * 0.5 + 0.5; // 0 to 1
      let speed = baseSpeed + (strokePropulsion * 1.5 * this.scale);
      
      if (dist < 20) speed *= (dist / 20); // Decelerate smoothly at target

      this.x += Math.cos(this.angle) * speed;
      this.y += Math.sin(this.angle) * speed;

      // INVERSE KINEMATICS LOGIC - The magic for realistic movement ✨
      this.spine[0].x = this.x;
      this.spine[0].y = this.y;
      this.spine[0].angle = this.angle;

      for (let i = 1; i < this.numSegments; i++) {
        let prev = this.spine[i - 1];
        let curr = this.spine[i];
        
        let sdx = prev.x - curr.x;
        let sdy = prev.y - curr.y;
        curr.angle = Math.atan2(sdy, sdx);
        
        // Force the segment to be exactly 'segmentLength' away from previous
        curr.x = prev.x - Math.cos(curr.angle) * this.segmentLength;
        curr.y = prev.y - Math.sin(curr.angle) * this.segmentLength;
      }
    }

    draw() {
      // Create path for the body outlines
      let leftPts = [];
      let rightPts = [];

      for (let i = 0; i < this.numSegments; i++) {
        let pt = this.spine[i];
        let w = this.widths[i];
        
        // Calculate perpendicular points
        leftPts.push({
          x: pt.x + Math.cos(pt.angle - Math.PI/2) * w,
          y: pt.y + Math.sin(pt.angle - Math.PI/2) * w
        });
        rightPts.push({
          x: pt.x + Math.cos(pt.angle + Math.PI/2) * w,
          y: pt.y + Math.sin(pt.angle + Math.PI/2) * w
        });
      }

      // --- SHADOW ---
      ctx.save();
      ctx.translate(20, 30); // Offset for deep water shadow
      this.drawBodyPath(leftPts, rightPts);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.filter = 'blur(15px)';
      ctx.fill();
      ctx.restore();

      // --- PECTORAL FINS (Side Fins) ---
      // Attach to segment 3
      let pFinIdx = 3;
      let pFin = this.spine[pFinIdx];
      let finWobble = Math.sin(this.swimCycle * 2) * 0.3; // Flapping motion
      
      ctx.fillStyle = 'rgba(240, 240, 240, 0.6)';
      
      // Left Fin
      ctx.save();
      ctx.translate(leftPts[pFinIdx].x, leftPts[pFinIdx].y);
      ctx.rotate(pFin.angle - Math.PI/4 + finWobble);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(20 * this.scale, -30 * this.scale, -10 * this.scale, -45 * this.scale);
      ctx.quadraticCurveTo(-30 * this.scale, -20 * this.scale, 0, 0);
      ctx.fill();
      // Fin ray lines
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      // Right Fin
      ctx.save();
      ctx.translate(rightPts[pFinIdx].x, rightPts[pFinIdx].y);
      ctx.rotate(pFin.angle + Math.PI/4 - finWobble);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(20 * this.scale, 30 * this.scale, -10 * this.scale, 45 * this.scale);
      ctx.quadraticCurveTo(-30 * this.scale, 20 * this.scale, 0, 0);
      ctx.fill();
      ctx.stroke();
      ctx.restore();


      // --- BODY RENDERING ---
      ctx.save();
      this.drawBodyPath(leftPts, rightPts);
      
      // Base color (White/Cream)
      ctx.fillStyle = '#f9f9f5';
      ctx.fill();
      
      // Clipping path for patterns so they don't bleed out of the body
      ctx.clip(); 

      // Draw random splotches
      this.splotches.forEach(spot => {
        let seg = this.spine[spot.segmentIndex];
        ctx.save();
        ctx.translate(seg.x, seg.y);
        ctx.rotate(seg.angle);
        ctx.beginPath();
        ctx.fillStyle = spot.color;
        // Make the spots slightly elongated along the body
        ctx.ellipse(spot.offsetX, 0, spot.size * 1.2, spot.size * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 3D Lighting Overlay (Gradient)
      // Makes the spine look raised and wet
      let head = this.spine[0];
      let tail = this.spine[this.numSegments - 1];
      let bodyGrad = ctx.createLinearGradient(
        head.x + Math.cos(head.angle - Math.PI/2) * 30 * this.scale, 
        head.y + Math.sin(head.angle - Math.PI/2) * 30 * this.scale,
        head.x + Math.cos(head.angle + Math.PI/2) * 30 * this.scale,
        head.y + Math.sin(head.angle + Math.PI/2) * 30 * this.scale
      );
      bodyGrad.addColorStop(0, 'rgba(0,0,0,0.3)'); // Dark left edge
      bodyGrad.addColorStop(0.3, 'rgba(255,255,255,0.4)'); // Highlight
      bodyGrad.addColorStop(1, 'rgba(0,0,0,0.3)'); // Dark right edge
      
      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.restore(); // End clipping

      // --- EYES ---
      let eyeIdx = 1;
      let eyeSeg = this.spine[eyeIdx];
      let eyeDist = this.widths[eyeIdx] * 0.7;
      
      // Left eye
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(
        eyeSeg.x + Math.cos(eyeSeg.angle - Math.PI/2) * eyeDist,
        eyeSeg.y + Math.sin(eyeSeg.angle - Math.PI/2) * eyeDist,
        3 * this.scale, 0, Math.PI * 2
      );
      ctx.fill();
      // Right eye
      ctx.beginPath();
      ctx.arc(
        eyeSeg.x + Math.cos(eyeSeg.angle + Math.PI/2) * eyeDist,
        eyeSeg.y + Math.sin(eyeSeg.angle + Math.PI/2) * eyeDist,
        3 * this.scale, 0, Math.PI * 2
      );
      ctx.fill();

      // --- DORSAL FIN (Top spine fin) ---
      ctx.save();
      ctx.beginPath();
      let dStart = 4;
      let dEnd = 10;
      ctx.moveTo(this.spine[dStart].x, this.spine[dStart].y);
      // Curve it out based on swimming wobble
      for (let i = dStart; i <= dEnd; i++) {
        let seg = this.spine[i];
        let sway = Math.sin(this.swimCycle - i*0.2) * 4 * this.scale;
        ctx.lineTo(
          seg.x + Math.cos(seg.angle + Math.PI/2) * sway, 
          seg.y + Math.sin(seg.angle + Math.PI/2) * sway
        );
      }
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 4 * this.scale;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.restore();

      // --- TAIL FIN (Caudal Fin) ---
      let tailSeg = this.spine[this.numSegments - 1];
      let tailAngle = tailSeg.angle;
      
      ctx.save();
      ctx.translate(tailSeg.x, tailSeg.y);
      ctx.rotate(tailAngle);
      
      // Beautiful flowy tail gradient
      let tailGrad = ctx.createLinearGradient(0, 0, -60 * this.scale, 0);
      tailGrad.addColorStop(0, 'rgba(249, 249, 245, 0.9)');
      tailGrad.addColorStop(1, 'rgba(249, 249, 245, 0.0)');

      ctx.fillStyle = tailGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      // Top lobe
      ctx.quadraticCurveTo(-20 * this.scale, -40 * this.scale, -60 * this.scale, -35 * this.scale);
      // Center curve
      ctx.quadraticCurveTo(-40 * this.scale, 0, -60 * this.scale, 35 * this.scale);
      // Bottom lobe
      ctx.quadraticCurveTo(-20 * this.scale, 40 * this.scale, 0, 0);
      ctx.fill();
      
      // Tail details (rays)
      ctx.strokeStyle = 'rgba(0,0,0,0.05)';
      ctx.lineWidth = 1;
      for(let i=-20; i<=20; i+=10) {
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.quadraticCurveTo(-20 * this.scale, i * this.scale, -50 * this.scale, (i*1.5) * this.scale);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Helper to connect left and right spine points into a smooth blob
    drawBodyPath(leftPts, rightPts) {
      ctx.beginPath();
      
      // Head curve
      let head = this.spine[0];
      ctx.moveTo(leftPts[0].x, leftPts[0].y);
      ctx.quadraticCurveTo(
        head.x + Math.cos(head.angle) * this.widths[0] * 1.5, 
        head.y + Math.sin(head.angle) * this.widths[0] * 1.5,
        rightPts[0].x, rightPts[0].y
      );

      // Right side
      for (let i = 1; i < this.numSegments; i++) {
        ctx.lineTo(rightPts[i].x, rightPts[i].y);
      }

      // Tail curve
      let tail = this.spine[this.numSegments - 1];
      ctx.quadraticCurveTo(
        tail.x - Math.cos(tail.angle) * 5, 
        tail.y - Math.sin(tail.angle) * 5,
        leftPts[this.numSegments - 1].x, leftPts[this.numSegments - 1].y
      );

      // Left side (going backwards)
      for (let i = this.numSegments - 2; i >= 0; i--) {
        ctx.lineTo(leftPts[i].x, leftPts[i].y);
      }
      ctx.closePath();
    }
  }

  // SPAWN THE REALISTIC FISHIES!!
  const kois = [
    new RealisticKoi(width * 0.4, height * 0.5, 1.2, 'kohaku'), // Classic white/red
    new RealisticKoi(width * 0.6, height * 0.6, 0.9, 'showa')  // Has black spots too
  ];

  function animate() {
    // Semi-transparent clear to leave VERY slight trails for fluid feel, 
    // but keep it mostly crisp!
    ctx.fillStyle = '#06151a'; 
    ctx.fillRect(0, 0, width, height);
    
    // Custom gradient background drawn every frame
    let bgGrad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
    bgGrad.addColorStop(0, '#0d2a33');
    bgGrad.addColorStop(1, '#030b0e');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);
    
    // Sort so smaller fish is drawn first (underneath)
    kois.sort((a,b) => a.scale - b.scale);

    kois.forEach(koi => {
      koi.update();
      koi.draw();
    });
    
    requestAnimationFrame(animate);
  }

  window.onload = () => {
    animate();
  };
</script>
</body>
</html>
