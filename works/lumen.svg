<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1120" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lumenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d9b8"/>
      <stop offset="0.55" stop-color="#e9a578"/>
      <stop offset="1" stop-color="#b85a2c"/>
    </linearGradient>
    <radialGradient id="lumenGlow" cx="0.7" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff3d1" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff3d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ea"/>
      <stop offset="1" stop-color="#d9a472"/>
    </linearGradient>
    <linearGradient id="bottleShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(0,0,0,0.25)"/>
      <stop offset="0.5" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.25)"/>
    </linearGradient>
  </defs>

  <rect width="960" height="1120" fill="url(#lumenBg)"/>
  <rect width="960" height="1120" fill="url(#lumenGlow)"/>

  <!-- soft sun circle -->
  <circle cx="720" cy="280" r="180" fill="#fff3d1" opacity="0.45"/>

  <!-- horizon shadow -->
  <ellipse cx="480" cy="940" rx="520" ry="60" fill="rgba(0,0,0,0.25)" filter="blur(20px)"/>

  <!-- bottle 1 -->
  <g transform="translate(330 540)">
    <rect x="0" y="0" width="160" height="380" rx="22" fill="url(#bottle)"/>
    <rect x="0" y="0" width="160" height="380" rx="22" fill="url(#bottleShade)" opacity="0.5"/>
    <rect x="55" y="-26" width="50" height="32" rx="6" fill="#3a2418"/>
    <rect x="20" y="150" width="120" height="120" rx="6" fill="#fdf6ea" opacity="0.85"/>
    <text x="80" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#3a2418">Lumen</text>
    <line x1="40" y1="215" x2="120" y2="215" stroke="#3a2418" stroke-width="0.8"/>
    <text x="80" y="238" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="9" letter-spacing="2" fill="#3a2418">RADIANT OIL</text>
    <text x="80" y="255" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="7" letter-spacing="1.5" fill="#3a2418">30 ML / 1 FL OZ</text>
  </g>

  <!-- bottle 2 (smaller, behind) -->
  <g transform="translate(540 600)" opacity="0.92">
    <rect x="0" y="0" width="120" height="300" rx="18" fill="url(#bottle)"/>
    <rect x="0" y="0" width="120" height="300" rx="18" fill="url(#bottleShade)" opacity="0.5"/>
    <rect x="40" y="-20" width="40" height="26" rx="5" fill="#3a2418"/>
    <rect x="14" y="110" width="92" height="90" rx="5" fill="#fdf6ea" opacity="0.85"/>
    <text x="60" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#3a2418">Lumen</text>
    <text x="60" y="175" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="7" letter-spacing="2" fill="#3a2418">SERUM</text>
  </g>

  <!-- header text -->
  <text x="60" y="100" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#3a2418" opacity="0.7">Lumen &amp; Co.</text>
  <text x="60" y="150" font-family="Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#3a2418" letter-spacing="-1">Glow,</text>
  <text x="60" y="210" font-family="Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#3a2418" letter-spacing="-1">reframed.</text>
  <text x="60" y="260" font-family="Helvetica, sans-serif" font-size="14" fill="#3a2418" opacity="0.8" letter-spacing="2">SS26 COLLECTION  ·  NOW LIVE</text>

  <!-- bottom UI strip -->
  <rect x="60" y="1010" width="840" height="64" rx="32" fill="rgba(58,36,24,0.92)"/>
  <text x="100" y="1050" font-family="Helvetica, sans-serif" font-size="14" fill="#fdf6ea" letter-spacing="3">SHOP THE EDIT</text>
  <circle cx="855" cy="1042" r="22" fill="#fdf6ea"/>
  <path d="M848 1042 L865 1042 M858 1035 L865 1042 L858 1049" stroke="#3a2418" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
